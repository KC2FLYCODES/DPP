<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DPP · Supplier packet</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0A0B15">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0A0B15;--navy:#14172B;--pale:#EEF1F9;--paper:#f4f1ea;--line:#dcd7cb;--muted:#6b6f82;--gold:#B98A4A;--mono:"JetBrains Mono",ui-monospace,monospace;--sans:Inter,"Helvetica Neue",Arial,sans-serif;--disp:"Archivo Black","Arial Black",sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--navy);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
  .cap{font:500 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  header.bar{background:var(--ink);color:var(--pale)}
  header.bar .wrap{display:flex;align-items:center;gap:16px;height:64px}
  .mark{width:44px;height:38px;background:var(--pale);-webkit-mask:url(assets/logo.png) center/contain no-repeat;mask:url(assets/logo.png) center/contain no-repeat}
  header.bar .cap{color:#9aa0b8}
  header.bar .sp{flex:1}
  .hero{padding:clamp(28px,5vw,56px) 0 22px;border-bottom:1px solid var(--line)}
  .hero h1{font:400 clamp(30px,5.4vw,58px)/.98 var(--disp);letter-spacing:-.01em;text-transform:uppercase;margin:10px 0 14px}
  .meta{display:flex;flex-wrap:wrap;gap:8px 26px}
  .meta div{display:flex;flex-direction:column;gap:2px}
  .meta b{font:500 14px var(--sans)}
  .note{margin-top:22px;max-width:70ch;white-space:pre-wrap;font-size:14.5px;color:#2b2f45}
  section{padding:30px 0;border-bottom:1px solid var(--line)}
  section > .wrap > h2{font:400 20px var(--disp);text-transform:uppercase;letter-spacing:.01em;margin-bottom:16px;display:flex;align-items:baseline;gap:14px}
  .gal{display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:14px}
  .stage{position:relative;background:#efebe3;border:1px solid var(--line);aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}
  .stage img{width:100%;height:100%;object-fit:contain;display:block}
  .stage .dl{position:absolute;right:12px;bottom:12px}
  .thumbs{display:flex;flex-direction:column;gap:10px}
  .thumbs button{border:1px solid var(--line);background:#efebe3;padding:0;cursor:pointer;aspect-ratio:1/1;position:relative;overflow:hidden}
  .thumbs button img{width:100%;height:100%;object-fit:contain;display:block}
  .thumbs button span{position:absolute;left:6px;bottom:5px;font:500 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:rgba(239,235,227,.9);padding:1px 4px}
  .thumbs button.on{outline:2px solid var(--navy);outline-offset:-2px}
  .btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--navy);background:var(--navy);color:var(--pale);font:600 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--navy)}
  .btn:disabled{opacity:.45;cursor:default}
  .files{display:grid;gap:0;border-top:1px solid var(--navy)}
  .file{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
  .file b{display:block;font:600 15px var(--sans)}
  .file .cap{display:block;margin-top:2px}
  .tp-frame{width:100%;height:min(82vh,1100px);border:1px solid var(--line);background:#e9e5dc;display:block}
  .tp-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  footer{padding:30px 0 48px;color:var(--muted);font-size:13px}
  footer p+p{margin-top:6px}
  .state{min-height:70vh;display:grid;place-items:center;text-align:center;padding:40px 16px}
  .state h1{font:400 clamp(26px,4vw,40px) var(--disp);text-transform:uppercase;margin:16px 0 10px}
  .state p{color:var(--muted);max-width:46ch;margin:0 auto}
  .loading{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  @media (max-width:760px){
    .gal{grid-template-columns:1fr}
    .thumbs{flex-direction:row;overflow-x:auto}
    .thumbs button{flex:0 0 96px}
    .file{grid-template-columns:1fr auto}
    .file .btn.ghost{display:none}
    .tp-frame{height:70vh}
  }
</style>
</head>
<body>
<header class="bar"><div class="wrap"><span class="mark" role="img" aria-label="DPP"></span><span class="cap">Supplier packet</span><span class="sp"></span><span class="cap" id="exp"></span></div></header>
<main id="app"><div class="state"><p class="loading">Loading packet…</p></div></main>
<script type="module" src="share.js?v=20261123d"></script>
</body>
</html>
